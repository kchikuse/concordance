        />

    </button>
    <main>
      <nav id="navigation">
        <div class="selector">
          <input
            type="search"
            id="search-input"
            placeholder="Search (e.g., 'love never fails' or 'Gen 1:1')"
            autocomplete="off"
          />
        </div>
        <div class="selector">
          <select id="book-select" aria-labelledby="book-select-label" disabled>
            <option value="">Loading Books...</option>
          </select>
        </div>
        <div class="selector">
          <select
            id="chapter-select"
            aria-labelledby="chapter-select-label"
            disabled
          >
            <option value="">Select Book First</option>
          </select>
        </div>
      </nav>

      <div id="search-results-container" style="display: none"></div>

      <div id="verse-container"></div>
    </main>

    <div id="strongs-tooltip" class="tooltip" role="tooltip">
      <button class="tooltip-copy-button" aria-label="Copy to clipboard">
        <svg
          class="copy-icon"
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path
            d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
          ></path>
        </svg>
        <svg
          class="check-icon"
          style="display: none"
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </button>
      <div id="tooltip-content"></div>
      <div class="tooltip-arrow"></div>
    </div>
