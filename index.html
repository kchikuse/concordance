<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore scripture with precision through original Hebrew and Greek word studies" />
    <title>Concordance</title>
    <meta name="theme-color" content="#111827" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <button id="theme-toggle" aria-label="Toggle dark mode">
      <svg class="sun-icon" viewBox="0 0 24 24">
        <path
          d="M12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3zm-9 4c0 .55-.45 1-1 1s-1-.45-1-1 .45-1 1-1 1 .45 1 1zm20 0c0 .55-.45 1-1 1s-1-.45-1-1 .45-1 1-1 1 .45 1 1zm-9-11c0 .55-.45 1-1 1s-1-.45-1-1 .45-1 1-1 1 .45 1 1zm0 20c0 .55-.45 1-1 1s-1-.45-1-1 .45-1 1-1 1 .45 1 1zm-9-10c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm18 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM4.5 7.5c.28.28.28.72 0 1-.28.28-.72.28-1 0s-.28-.72 0-1 .72-.28 1 0zm15 15c.28.28.28.72 0 1-.28.28-.72.28-1 0s-.28-.72 0-1 .72-.28 1 0zm-15 0c.28.28.28.72 0 1-.28.28-.72.28-1 0s-.28-.72 0-1 .72-.28 1 0zm15-15c.28.28.28.72 0 1-.28.28-.72.28-1 0s-.28-.72 0-1 .72-.28 1 0z"
        />
      </svg>
      <svg class="moon-icon" viewBox="0 0 24 24" style="display: none">
        <path
          d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"
        />
      </svg>
    </button>
    <main>
      <nav id="navigation">
        <div class="selector">
          <input
            type="search"
            id="search-input"
            placeholder="Search (e.g., 'love never fails' or 'Gen 1:1')"
            autocomplete="off"
          />
        </div>
        <div class="selector">
          <select id="book-select" aria-labelledby="book-select-label" disabled>
            <option value="">Loading Books...</option>
          </select>
        </div>
        <div class="selector">
          <select
            id="chapter-select"
            aria-labelledby="chapter-select-label"
            disabled
          >
            <option value="">Select Book First</option>
          </select>
        </div>
      </nav>

      <div id="search-results-container" style="display: none"></div>

      <div id="verse-container"></div>
    </main>

    <div id="strongs-modal" class="modal">
      <div class="modal-content">
        <span class="close-button">×</span>
        <h2 id="modal-key"></h2>
        <div id="modal-body"></div>
      </div>
    </div>

    <script src="assets/scripts/database.service.js"></script>
    <script src="assets/scripts/main.js"></script>
  </body>
</html>
